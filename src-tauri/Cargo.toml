[package]
name = "yet-another-microsoft-store"
version = "0.1.0"
description = "Windows client for direct Microsoft Store package delivery"
authors = ["Yet Another Microsoft Store contributors"]
edition = "2021"

[features]
broker-dependency = []

[workspace]
members = [".", "broker"]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yet_another_microsoft_store_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-opener = "=2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
storelib_rs = "=0.1.11"
roxmltree = "=0.20.0"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
zip = "=8.0.0"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "=0.12.28", features = ["socks", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "sync", "time"] }
futures-util = "0.3"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Management_Deployment",
    "System",
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }
windows-collections = "=0.3.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
