[package]
name = "yet-another-microsoft-store-deployment-broker"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "deployment-broker"
path = "src/main.rs"

[dependencies]
serde_json = "1"
yet-another-microsoft-store = { package = "yet-another-microsoft-store", path = "..", features = ["broker-dependency"] }

[build-dependencies]
embed-resource = "3.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
] }
